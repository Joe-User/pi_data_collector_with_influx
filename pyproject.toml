[project]
name = "pi-data-collector"
version = "0.1.0"
description = "Raspberry Pi 1-Wire temperature/humidity collector writing to InfluxDB"
requires-python = ">=3.11"
dependencies = [
  "influxdb-client>=1.40",
  "textual>=0.60",
  "tomlkit>=0.12",
  "plotext>=5.2",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.16",
  "mypy>=1.11",
  "pre-commit>=3.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Hard gate = real problems only (see _starter-kits/python for rationale).
select = ["F", "B", "E4", "E7", "E9"]
ignore = []
# extend-select = ["I", "UP", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# collector.py / tui.py are top-level modules, not a package.
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["."]
omit = ["tests/*", ".venv/*"]
